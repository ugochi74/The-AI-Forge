[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-forge-environment-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.3",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = ["pip-tools>=7.6"]

[tool.setuptools]
py-modules = []
